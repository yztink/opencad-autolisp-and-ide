[package]
name = "opencad-lisp-and-ide"
version = "0.4.1"
edition = "2021"
description = "OpenCAD LISP command, script runner, and OCIDE editor plugin for OpenCAD Studio"
license = "GPL-3.0-only"

[lib]
name = "opencad_lisp"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "opencad_lisp_ide"
path = "src/bin/opencad_lisp_ide.rs"
required-features = ["ide-gui"]

[features]
default = []
ide-gui = ["dep:iced", "dep:iced_aw", "dep:fontdb", "dep:rfd"]
python = ["dep:pyo3"]

[dependencies]
ocs_plugin_api = { path = "../OpenCADStudio/crates/ocs_plugin_api", features = ["host"] }
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lisp-core = { path = "../opencad-lisp-engine/crates/lisp-core" }
lisp-cad = { path = "../opencad-lisp-engine/crates/lisp-cad" }
iced = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39", features = ["svg", "advanced", "canvas", "smol", "markdown", "highlighter"], optional = true }
iced_aw = { git = "https://github.com/HakanSeven12/iced_aw.git", branch = "agent/fix-iced-fonts", features = ["menu", "context_menu", "color_picker", "drop_down"], optional = true }
fontdb = { version = "0.23", optional = true }
rfd = { version = "0.17", optional = true }

[dev-dependencies]
interprocess = "2.4"

[patch.crates-io]
iced_core = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }
iced_widget = { git = "https://github.com/iced-rs/iced.git", rev = "23604ff22ab0aad9e00b9327cb7b8546ed84db39" }

[patch.'https://github.com/HakanSeven12/acadrust.git']
acadrust = { git = "https://github.com/hakanaktt/acadrust.git", rev = "53e6420c4df4d207409798c2719d32fc6cf2811d" }
