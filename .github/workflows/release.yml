name: Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: dll
            exe_ext: .exe
            platform: windows-x86_64
          - os: ubuntu-22.04
            ext: so
            exe_ext: ""
            platform: linux-x86_64
          - os: macos-latest
            ext: dylib
            exe_ext: ""
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev

      # 1. Checkout all three repos side-by-side to satisfy relative Cargo path dependencies
      - name: Checkout opencad-autolisp-and-ide
        uses: actions/checkout@v4
        with:
          path: opencad-autolisp-and-ide

      - name: Checkout opencad-autolisp-engine
        uses: actions/checkout@v4
        with:
          repository: yztink/opencad-autolisp-engine
          path: opencad-autolisp-engine

      - name: Checkout OpenCADStudio
        uses: actions/checkout@v4
        with:
          repository: HakanSeven12/OpenCADStudio
          ref: v2026.47
          path: OpenCADStudio

      - name: Redirect deleted HakanSeven12/acadrust URL to hakanaktt/acadrust
        run: |
          git config --global url."https://github.com/hakanaktt/acadrust.git".insteadOf "https://github.com/HakanSeven12/acadrust.git"
          git config --global url."https://github.com/hakanaktt/acadrust".insteadOf "https://github.com/HakanSeven12/acadrust"

      # 2. Setup Rust toolchain
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: opencad-autolisp-and-ide -> target

      # 3. Build release binaries (lean plugin library + standalone IDE GUI)
      - name: Build release binaries
        working-directory: opencad-autolisp-and-ide
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-Wl,-rpath,\$ORIGIN -C link-arg=-Wl,-z,origin"
          fi
          cargo build --release --lib
          cargo build --release --bin opencad_autolisp_ide --features ide-gui

      # 4. Stage release assets into a zip bundle and loose assets
      - name: Stage release package
        shell: bash
        run: |
          mkdir -p bundle
          mkdir -p dist

          # Copy plugin.toml, INSTALL instructions, and tutorials
          cp opencad-autolisp-and-ide/plugin.toml bundle/plugin.toml
          cp opencad-autolisp-and-ide/INSTALL.txt bundle/INSTALL.txt
          cp -r opencad-autolisp-and-ide/tutorials bundle/tutorials

          # Copy plugin library (named for OpenCAD Studio)
          cp opencad-autolisp-and-ide/target/release/*opencad_autolisp.${{ matrix.ext }} "bundle/opencad.autolisp_and_ide.${{ matrix.ext }}"

          # Copy IDE executable if present
          if [ -f "opencad-autolisp-and-ide/target/release/opencad_autolisp_ide${{ matrix.exe_ext }}" ]; then
            cp "opencad-autolisp-and-ide/target/release/opencad_autolisp_ide${{ matrix.exe_ext }}" "bundle/opencad_autolisp_ide${{ matrix.exe_ext }}"
          fi

          # Create all-in-one ZIP bundle for this platform: <plugin_id>-<platform>.zip
          (cd bundle && python -m zipfile -c "../dist/opencad.autolisp_and_ide-${{ matrix.platform }}.zip" *)

          # Also include standalone plugin.toml in dist/ so OpenCAD Studio's Plugin Manager
          # can inspect release compatibility before downloading the platform zip bundle
          cp opencad-autolisp-and-ide/plugin.toml dist/plugin.toml

      # 5. Upload all artifacts to the GitHub Release
      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
